services:
  - type: web
    name: turtle-soup-webhook
    env: docker
    plan: free
    dockerContext: .
    dockerfilePath: Dockerfile
    autoDeploy: true
    envVars:
      - key: TRADINGVIEW_WEBHOOK_SECRET
        value: REPLACE_ME
      - key: TELEGRAM_BOT_TOKEN
        value: ""
      - key: TELEGRAM_CHAT_ID
        value: ""
      - key: OANDA_ACCOUNT_ID
        value: "101-002-38678740-001"
      - key: OANDA_API_TOKEN
        value: REPLACE_ME
      - key: AUTO_EXECUTE
        value: "true"
      - key: DEFAULT_ORDER_UNITS
        value: "10000"
